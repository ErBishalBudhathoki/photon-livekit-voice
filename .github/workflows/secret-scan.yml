name: secret-scan

# The same scanner the local hooks use, so a `--no-verify` commit cannot land a
# secret. Dependency-free on purpose: python3 is already the only tool the repo
# needs to scan itself.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and deleted is still a secret.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the tree and the history
        run: python3 scripts/secret-scan.py

      - name: Check the bootstrap scripts still parse
        run: |
          python3 -m py_compile bootstrap/*.py agent/*.py cli/*.py \
            tests/*.py scripts/*.py surface/hermes-plugin/*.py
          for f in bootstrap/*.sh install.sh scripts/*.sh \
                   surface/hermes-plugin/install.sh; do bash -n "$f"; done
